# sshd fixture for Dromon's integration tests. Start it with `bash tests/docker/setup.sh`,
# which also generates the test keypairs in tests/docker/.keys/ (git-ignored).
name: dromon-fixture

services:
  sshd:
    build: .
    image: dromon-fixture-sshd
    ports:
      - "127.0.0.1:${DROMON_SSH_FIXTURE_PORT:-2222}:22"
    volumes:
      - ./.keys/id_ed25519.pub:/keys/id_ed25519.pub:ro
      - ./.keys/id_ed25519_enc.pub:/keys/id_ed25519_enc.pub:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/dromon-ready && nc -z 127.0.0.1 22"]
      interval: 1s
      timeout: 2s
      retries: 120
      start_period: 60s
