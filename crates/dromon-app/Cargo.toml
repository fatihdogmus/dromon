[package]
name = "dromon-app"
description = "Dromon: a small, fast SFTP file browser"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
# `cargo run -p dromon-app` runs the app; `dromon-hot` is for scripts/dev.sh only.
default-run = "dromon"

# The app (UI, state, service thread) is a library so the end-to-end tests (`tests/e2e.rs`) can
# drive it with the real `dromon` binary as ssh's askpass helper (`CARGO_BIN_EXE_dromon`).
[lib]
name = "dromon_app"
path = "src/lib.rs"

[[bin]]
name = "dromon"
path = "src/main.rs"

# Live editing only (`scripts/dev.sh`): the app compiled as one crate (src/hot.rs includes the
# same root items as lib.rs), so hot patching, which reaches only the executable's own crate,
# covers the views.
[[bin]]
name = "dromon-hot"
path = "src/hot.rs"
required-features = ["hot"]

[features]
# Rune's headless phase clocks (`frame-profile`) for `examples/perf.rs` (`scripts/perf.sh`):
# the scroll frames split into view, commit, layout, text and paint. Measuring builds only.
perf = ["rune/frame-profile"]
# Live editing (`scripts/dev.sh`, the `dromon-hot` binary): saved function-body edits under
# src/views and src/theme patch into the running window. Development only; release builds and
# goldens never enable it.
hot = ["rune/hot"]

[dependencies]
dromon-core.workspace = true
dromon-sftp.workspace = true
dromon-ssh.workspace = true
dromon-transfer.workspace = true
# `tooling`: release builds take Rune's `--snap`, `--script`, `--tree` (debug builds always do), so
# the release smoke check and issue repros run on the binaries users get.
# native-file-dialog: the identity file picker in quick connect (rfd on macOS and Windows, the
# XDG portal on Linux).
rune = { workspace = true, features = ["tooling", "native-file-dialog"] }
# System notifications when a long transfer ends while the window is in the background (§5 M2).
rune-notify.workspace = true
secrecy.workspace = true
# Fixtures (`--fixture`, the built-in demo) and remembered settings (`state::prefs`).
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zeroize.workspace = true
# Updates (`service/update.rs`): one HTTPS request to GitHub's releases API per check, and the
# release's files when installing. rustls with ring and webpki's roots: no OpenSSL, no system
# TLS library. `SHA256SUMS.minisig` is checked with minisign-verify against the release key built
# into the app, and the download's SHA-256 (ring's, the TLS provider ureq already builds) against
# `SHA256SUMS`.
minisign-verify = "0.3"
ring = "0.17"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
dromon-testkit.workspace = true
hegeltest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
