[package]
name = "dromon-app"
description = "Dromon: a small, fast SFTP file browser"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The app (UI, state, service thread) is a library so the end-to-end tests (`tests/e2e.rs`) can
# drive it with the real `dromon` binary as ssh's askpass helper (`CARGO_BIN_EXE_dromon`).
[lib]
name = "dromon_app"
path = "src/lib.rs"

[[bin]]
name = "dromon"
path = "src/main.rs"

[dependencies]
dromon-core.workspace = true
dromon-sftp.workspace = true
dromon-ssh.workspace = true
dromon-transfer.workspace = true
# `tooling`: release builds take Rune's `--snap`, `--script`, `--tree` (debug builds always do), so
# the release smoke check and issue repros run on the binaries users get.
# native-file-dialog: the identity file picker in quick connect (rfd on macOS and Windows, the
# XDG portal on Linux).
rune = { workspace = true, features = ["tooling", "native-file-dialog"] }
secrecy.workspace = true
# Fixtures (`--fixture`, the built-in demo) and remembered settings (`state::prefs`).
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
dromon-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true
