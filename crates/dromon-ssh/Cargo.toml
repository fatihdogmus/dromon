[package]
name = "dromon-ssh"
description = "Host discovery, the system ssh process, askpass IPC and the in-memory password store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dromon-core.workspace = true
getrandom.workspace = true
glob.workspace = true
hex.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true

# The askpass named pipe: its DACL and the client-user check (`src/askpass/win32.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# The askpass helper alone, for integration tests (`CARGO_BIN_EXE_dromon-askpass-test-helper`).
[[bin]]
name = "dromon-askpass-test-helper"
path = "src/bin/dromon-askpass-test-helper.rs"
test = false
doc = false

[dev-dependencies]
dromon-sftp.workspace = true
dromon-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true
