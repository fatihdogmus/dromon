name: CI

# Every push to main and every pull request:
# - linux: clippy, the whole test suite with the Docker sshd fixture required (testcontainers),
#   goldens unchanged, the smoke script (headless, real window under Xvfb, real connect), and the
#   --script flows rendered as artifacts for review.
# - linux-matrix: the SFTP and transfer checks against every Docker server variant.
# - macos (Apple silicon) and macos-intel: the whole suite once, its sshd fixture tests against a
#   private native sshd instead of Docker (no Linux containers there): dromon-testkit's native
#   backend (DROMON_FIXTURE_BACKEND=native) starts Apple's sshd as root through sudo, with test
#   users dromon_*; the TOTP tests use Homebrew's google-authenticator-libpam as dromon_kbd's
#   second factor. Then the headless smoke.
# - windows: the whole suite once, its sshd fixture tests with Windows' own OpenSSH and the
#   named-pipe askpass against the same Linux image as linux: Docker runs in WSL2 (Ubuntu
#   24.04) and answers on tcp://127.0.0.1:2375; the ports its containers publish on 127.0.0.1
#   reach Windows through WSL's localhost forwarding. Then the headless smoke, and the transfer
#   checks against Windows' own sshd.
# Each test job builds once: one `cargo test --workspace`, and the scripts after it run the
# dromon it built (DROMON_BIN). A `-p` subset or `cargo build -p dromon-app` would resolve other
# dependency features and compile about a hundred crates again.
# - linux-package, macos-package, windows-package: each installer built with the release's
#   scripts (unsigned) and checked the way a user would install it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Fail, don't skip, when the sshd fixture can't start.
      DROMON_REQUIRE_DOCKER: "1"
      # No GPU on the runner: Mesa's software Vulkan (lavapipe) renders the goldens and windows.
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      # Line tables only (file:line in panics and backtraces, no full debug info): a smaller
      # build cache (GitHub keeps 10 GB per repository) and quicker links. Test jobs only:
      # rust-cache hashes CARGO_* into its key, and the package jobs share the release's.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # goldens, smoke and flows run the dromon the tests built: their own `cargo build -p
      # dromon-app` would resolve other dependency features and compile ~100 crates again.
      DROMON_BIN: target/debug/dromon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System packages
        uses: ./.github/actions/apt-install
        with:
          packages: libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev mesa-vulkan-drivers xvfb ffmpeg openssh-client python3-pil
          save: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo lint --locked
      - name: Tests (with the Docker sshd fixture)
        run: cargo test --workspace --locked
      # Within GOLDEN_TOLERANCE per channel: other Mesa versions round a few pixels differently.
      - name: Goldens unchanged
        run: cargo goldens --check
      - name: Upload changed goldens
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: goldens-linux
          path: target/goldens
          if-no-files-found: ignore
          retention-days: 7
      - name: Smoke (headless, window under Xvfb, real connect)
        timeout-minutes: 20
        run: |
          cargo smoke
          cargo smoke --window
          cargo smoke --connect
      # Also after an earlier step failed, but not in a cancelled run (always() would keep a
      # run a newer push superseded going, and hold up the newer one).
      - name: Flows
        if: ${{ !cancelled() }}
        run: cargo flows target/flows
      - name: Upload flows
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flows-linux
          path: target/flows
          if-no-files-found: ignore
          retention-days: 14

  # The server matrix (tests/docker/README.md), beside the linux job: the SFTP and transfer
  # checks against every Docker server: Debian trixie (OpenSSH 10), bullseye (OpenSSH 8.4p1: no
  # copy-data, no limits), Alpine (musl) and trixie behind toxiproxy (latency, bandwidth caps, a
  # reset mid-transfer), the 100k-entry folder included. One `matrix:` line per check and server.
  # Only dromon-sftp and dromon-transfer build here: no UI libraries, no system packages.
  linux-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DROMON_REQUIRE_DOCKER: "1"
      DROMON_SERVER_MATRIX: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only # as in linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux-matrix
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Server matrix (Docker sshd variants)
        timeout-minutes: 15
        run: cargo test --locked --no-fail-fast -p dromon-sftp -p dromon-transfer --test matrix

  # Apple silicon and Intel: the release ships one universal app for both.
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-15
          - name: macos-intel
            runner: macos-15-intel
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only # as in linux
      DROMON_BIN: target/debug/dromon # as in linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The native sshd's TOTP second factor for dromon_kbd (tests/docker/README.md): a bottle,
      # so seconds. Without it the TOTP tests would skip.
      - name: TOTP PAM module (Homebrew)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          brew install google-authenticator-libpam
          module="$(brew --prefix google-authenticator-libpam)/lib/security/pam_google_authenticator.so"
          ls -lL "$module"
          codesign -dv "$module" 2>&1 || true
      # The whole suite once. No Docker on macOS runners (no nested virtualisation): the sshd
      # fixture tests use dromon-testkit's native backend (Apple's /usr/sbin/sshd as root through
      # the runner's passwordless sudo, users dromon_*; tests/docker/README.md). The TOTP tests
      # run there too: dromon_kbd's PAM service adds the module above to Apple's sshd policy.
      # One `--workspace` run: a `-p` subset resolves other dependency features and recompiles
      # about a hundred crates. --no-fail-fast: every failing test binary, not just the first.
      - name: Tests (native sshd)
        env:
          DROMON_FIXTURE_BACKEND: native
          # Fail, don't skip, when the native sshd can't start.
          DROMON_REQUIRE_DOCKER: "1"
        run: cargo test --workspace --locked --no-fail-fast
      # GitHub's macOS runners may not expose Metal to headless rendering; non-blocking until a
      # first green run proves it.
      - name: Smoke (headless)
        continue-on-error: true
        timeout-minutes: 5
        run: cargo smoke

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only # as in linux
      DROMON_BIN: target/debug/dromon # as in linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # A Linux Docker for the sshd fixture (the runner's own Docker runs Windows containers
      # only): Ubuntu in WSL2, then the whole suite once against it.
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
      # Docker in WSL from cached .deb files, as .github/actions/apt-install does on Linux:
      # Ubuntu's mirror can be slow (setup-wsl's own apt-get install once took 20+ minutes).
      # The key is the exact files apt resolves; apt checks each cached file against the signed
      # package lists. Single-line `bash -c` commands: multi-line scripts reach WSL with CRLFs.
      - id: wsl-apt
        name: Docker packages for WSL (which .deb files)
        shell: pwsh
        run: |
          $files = wsl.exe -d Ubuntu-24.04 -u root -- bash -c 'apt-get update -qq > /dev/null && apt-get install -y --no-install-recommends --print-uris -qq docker.io docker-buildx | cut -d" " -f2 | sort'
          if ($LASTEXITCODE -ne 0) { throw 'apt-get in WSL failed' }
          $bytes = [Text.Encoding]::UTF8.GetBytes(($files -join "`n"))
          $hash = ([BitConverter]::ToString([Security.Cryptography.SHA256]::HashData($bytes)) -replace '-', '').Substring(0, 16).ToLower()
          "key=wsl-apt-ubuntu2404-$hash" >> $env:GITHUB_OUTPUT
          "$(@($files).Count) .deb files"
          New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'wsl-apt-debs') | Out-Null
      - id: wsl-apt-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\wsl-apt-debs
          key: ${{ steps.wsl-apt.outputs.key }}
      - id: wsl-docker
        name: Docker in WSL
        shell: pwsh
        timeout-minutes: 20
        run: |
          # Forward slashes: wsl.exe hands its arguments to a shell, which eats backslashes.
          $debs = wsl.exe -d Ubuntu-24.04 -- wslpath -u ((Join-Path $env:RUNNER_TEMP 'wsl-apt-debs') -replace '\\', '/')
          if ($LASTEXITCODE -ne 0 -or "$debs" -notmatch '^/') { throw "no WSL path for the .deb folder: $debs" }
          wsl.exe -d Ubuntu-24.04 -u root -- bash -c "set -e; cp $debs/*.deb /var/cache/apt/archives/ 2> /dev/null || true; DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends -o APT::Keep-Downloaded-Packages=true docker.io docker-buildx; cp /var/cache/apt/archives/*.deb $debs/ 2> /dev/null || true"
          if ($LASTEXITCODE -ne 0) { throw 'Docker did not install in WSL' }
          $count = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'wsl-apt-debs\*.deb')).Count
          "$count .deb files kept"
          "debs=$count" >> $env:GITHUB_OUTPUT
      # Never an empty cache: it would be a hit from then on, and nothing would be cached.
      - if: github.ref == 'refs/heads/main' && steps.wsl-apt-restore.outputs.cache-hit != 'true' && steps.wsl-docker.outputs.debs != '0'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\wsl-apt-debs
          key: ${{ steps.wsl-apt.outputs.key }}
      # WSL stops an idle distro, and dockerd with it.
      - name: Keep the distro running
        shell: pwsh
        run: Start-Process -WindowStyle Hidden wsl.exe -ArgumentList '-d','Ubuntu-24.04','-u','root','--','sleep','infinity'
      # Linux-side steps run through wsl-bash: scripts passed from pwsh to wsl keep CRLF endings.
      # docker.io's systemd unit owns dockerd, so the TCP listener comes from a drop-in.
      - name: dockerd on tcp 2375 too (systemd drop-in)
        shell: wsl-bash {0}
        run: |
          set -eux
          mkdir -p /etc/systemd/system/docker.service.d
          printf '[Service]\nExecStart=\nExecStart=/usr/bin/dockerd -H fd:// -H tcp://0.0.0.0:2375 --containerd=/run/containerd/containerd.sock\n' > /etc/systemd/system/docker.service.d/tcp.conf
          systemctl daemon-reload
          systemctl restart docker
      - name: Linux Docker answers from Windows
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddSeconds(60)
          while ($true) {
            try {
              $v = Invoke-RestMethod -TimeoutSec 5 http://127.0.0.1:2375/version
              if ($v.Os -eq 'linux') { "Docker $($v.Version) ($($v.Os)/$($v.Arch)) on 127.0.0.1:2375"; break }
            } catch {}
            if ((Get-Date) -gt $deadline) { throw 'no Linux Docker on http://127.0.0.1:2375 after 60 s' }
            Start-Sleep -Seconds 2
          }
      # The whole suite once, the fixture tests against the Docker sshd in WSL2 with Windows' own
      # OpenSSH client (dromon.exe as ssh's askpass helper in the end-to-end tests). One
      # `--workspace` run: a `-p` subset resolves other dependency features and recompiles about
      # a hundred crates. --no-fail-fast: every failing test binary, not just the first.
      # --skip: WSL's localhost relay into Docker now and then drops a connection busy both
      # ways, which a streamed same-session copy is (ConnectionLost even with a 60 s timeout:
      # runs 45752298056, 45753756067, 45778453075). The native sshd step below streams the same
      # copy five times against Windows' own sshd (windows_sshd.rs), so Windows keeps that coverage.
      - name: Tests (Docker sshd fixture in WSL2, Windows' OpenSSH)
        env:
          DOCKER_HOST: tcp://127.0.0.1:2375
          # Fail, don't skip, when the sshd fixture can't start.
          DROMON_REQUIRE_DOCKER: "1"
        run: cargo test --workspace --locked --no-fail-fast -- --skip same_host_copy_streams_when_told_and_resumes_from_the_part
      - name: Docker state
        if: failure()
        shell: wsl-bash {0}
        run: |
          docker ps -a
          docker image ls
      # Headless rendering on Windows runners (WARP) is unproven, and so far it hangs at the
      # first render: non-blocking and bounded until it works.
      - name: Smoke (headless)
        continue-on-error: true
        timeout-minutes: 5
        run: cargo smoke
      # Windows' own OpenSSH server as the SFTP server (crates/dromon-transfer/tests/windows_sshd.rs):
      # /C:/ paths through RemotePath, a transfer round trip, renames, a copy and a delete. Windows
      # Server 2025 ships the OpenSSH.Server capability with its sshd service disabled (added here
      # if missing). The runner's user is an administrator, so a fresh key goes into
      # administrators_authorized_keys, Win32-OpenSSH's file for that group, which sshd only reads
      # while just Administrators and SYSTEM have access to it.
      - name: Tests (Windows OpenSSH server, /C:/ paths)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $cap = Get-WindowsCapability -Online -Name 'OpenSSH.Server*'
          "capability $($cap.Name): $($cap.State)"
          if ($cap.State -ne 'Installed') { Add-WindowsCapability -Online -Name 'OpenSSH.Server~~~~0.0.1.0' | Out-Null }
          Set-Service -Name sshd -StartupType Manual
          Start-Service sshd
          $openssh = Join-Path $env:WINDIR 'System32\OpenSSH'
          "sshd $((Get-Item (Join-Path $openssh 'sshd.exe')).VersionInfo.ProductVersion): $((Get-Service sshd).Status)"
          $dir = Join-Path $env:RUNNER_TEMP 'winsshd'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $key = Join-Path $dir 'id_ed25519'
          # Start-Process joins its arguments as they are, so '""' reaches ssh-keygen as an empty
          # passphrase (a direct call would depend on $PSNativeCommandArgumentPassing).
          $keygen = Start-Process -FilePath (Join-Path $openssh 'ssh-keygen.exe') -NoNewWindow -Wait -PassThru `
            -ArgumentList '-q', '-t', 'ed25519', '-N', '""', '-C', 'dromon-windows-sshd', '-f', $key
          if ($keygen.ExitCode -ne 0) { throw "ssh-keygen: exit $($keygen.ExitCode)" }
          $auth = Join-Path $env:ProgramData 'ssh\administrators_authorized_keys'
          Get-Content "$key.pub" | Set-Content -Encoding ascii -Path $auth
          icacls.exe $auth /inheritance:r /grant '*S-1-5-32-544:F' /grant '*S-1-5-18:F' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "icacls: exit $LASTEXITCODE" }
          function Show-SshdLog {
            Get-WinEvent -LogName 'OpenSSH/Operational' -MaxEvents 40 -ErrorAction SilentlyContinue |
              Sort-Object TimeCreated | Format-Table -AutoSize -Wrap TimeCreated, Message | Out-Host
          }
          # One login first, for a clear error when the server or the key doesn't work.
          & (Join-Path $openssh 'ssh.exe') -F NUL -o BatchMode=yes -o StrictHostKeyChecking=no `
            -o UserKnownHostsFile=NUL -o IdentitiesOnly=yes -i $key "$env:USERNAME@127.0.0.1" 'echo %USERNAME% on %COMPUTERNAME%'
          if ($LASTEXITCODE -ne 0) { Show-SshdLog; throw "no public-key login as $env:USERNAME on 127.0.0.1:22" }
          $env:DROMON_WINDOWS_SSHD = '1'
          $env:DROMON_WINDOWS_SSHD_KEY = $key
          $env:DROMON_WINDOWS_SSHD_USER = $env:USERNAME
          $env:DROMON_WINDOWS_SSHD_PORT = '22'
          cargo test --locked -p dromon-transfer --test windows_sshd -- --nocapture
          $status = $LASTEXITCODE
          if ($status -ne 0) { Show-SshdLog }
          exit $status

  # ---- Packages: each platform's installer, unsigned, on every push --------------------------
  # The same scripts as release.yml, then each package checked the way a user would get it, so
  # a broken package shows on the push that broke it, not in the next release (a WiX error,
  # WIX0367, once hid until a release run).

  # The .deb and the Arch package, built on ubuntu-22.04 like the release (glibc 2.35), then
  # installed in clean debian:12, ubuntu:24.04 and archlinux containers (`dromon --version`).
  linux-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System packages
        uses: ./.github/actions/apt-install
        with:
          packages: dpkg-dev pkg-config libxkbcommon-dev libwayland-dev
          save: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The same cache as release.yml's build-linux (shared-key: no job name in the key).
          shared-key: release-linux-x64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build, install and run the packages
        run: cargo package-linux --arch x64 --build host --verify --out "$RUNNER_TEMP/linux"

  # The universal Dromon.app (Apple silicon + Intel) in its DMG, ad-hoc signed, then opened as a
  # user would: bundle, version, both architectures (the Intel half through Rosetta), signature.
  macos-package:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-macos-universal # release.yml's build-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build Dromon.app and the DMG
        run: bash packaging/macos/build-app.sh "$RUNNER_TEMP/build"
      - name: Open and check the DMG
        run: |
          version=$(awk '/^\[/ { s = $0 } s == "[workspace.package]" && $1 == "version" { gsub(/"/, "", $3); print $3; exit }' Cargo.toml)
          bash packaging/macos/verify-dmg.sh "$RUNNER_TEMP/build/Dromon-$version-macos-universal.dmg" "$version" false
      # To look at the installer window (and try the app) on a Mac: ad-hoc signed, so macOS asks
      # once (System Settings → Privacy & Security → Open Anyway).
      - name: Upload the DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dmg-macos
          path: ${{ runner.temp }}/build/*.dmg
          retention-days: 7

  # The Windows installer: silent install, check and uninstall.
  windows-package:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-windows-x64 # release.yml's build-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build dromon.exe (release, version resource)
        shell: pwsh
        run: packaging/windows/build-exe.ps1 -Arch x64 -Out "$env:RUNNER_TEMP/windows"
      - name: WiX Toolset v5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version "5.*"
          if ($LASTEXITCODE -ne 0) { throw 'Could not install WiX.' }
          Join-Path $env:USERPROFILE '.dotnet\tools' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build the MSI
        shell: pwsh
        run: packaging/windows/build-msi.ps1 -Exe "$env:RUNNER_TEMP/windows/dromon.exe" -Arch x64 -Out "$env:RUNNER_TEMP/msi"
      - name: Install, check and uninstall it
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $msi = Get-ChildItem "$env:RUNNER_TEMP/msi/*.msi" | Select-Object -First 1
          packaging/windows/verify-msi.ps1 -Msi $msi.FullName -Version $version
