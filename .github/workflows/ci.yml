name: CI

# Every push to main and every pull request:
# - linux: clippy, the whole test suite with the Docker sshd fixture required (testcontainers),
#   goldens unchanged, the smoke script (headless, real window under Xvfb, real connect), and the
#   --script flows rendered as artifacts for review.
# - macos: the test suite (the Docker fixture tests skip: no Linux containers there), then the
#   sshd fixture tests (askpass, SFTP, transfer I/O, the app's e2e and transfers) against a
#   private native sshd instead of Docker: dromon-testkit's native backend
#   (DROMON_FIXTURE_BACKEND=native) starts Apple's sshd as root through sudo, with test users
#   dromon_*; the TOTP tests use Homebrew's google-authenticator-libpam as dromon_kbd's second
#   factor. Then the headless smoke.
# - windows: the test suite, then the Docker sshd fixture tests (askpass, SFTP, transfer I/O, the
#   app's e2e, transfers and file operations) with Windows' own OpenSSH and the named-pipe
#   askpass, against the same Linux image: Docker runs in
#   WSL2 (Ubuntu 24.04) and answers on tcp://127.0.0.1:2375; the ports its containers publish on
#   127.0.0.1 reach Windows through WSL's localhost forwarding. Then the headless smoke.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Fail, don't skip, when the sshd fixture can't start.
      DROMON_REQUIRE_DOCKER: "1"
      # No GPU on the runner: Mesa's software Vulkan (lavapipe) renders the goldens and windows.
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev mesa-vulkan-drivers xvfb ffmpeg openssh-client python3-pil
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo lint --locked
      - name: Tests (with the Docker sshd fixture)
        run: cargo test --workspace --locked
      # The server matrix (tests/docker/README.md): the SFTP and transfer checks again against
      # every Docker server: Debian trixie (OpenSSH 10), bullseye (OpenSSH 8.4p1: no copy-data,
      # no limits), Alpine (musl) and trixie behind toxiproxy (latency, bandwidth caps, a reset
      # mid-transfer), the 100k-entry folder included. One `matrix:` line per check and server.
      - name: Server matrix (Docker sshd variants)
        timeout-minutes: 15
        env:
          DROMON_SERVER_MATRIX: "1"
        run: cargo test --locked --no-fail-fast -p dromon-sftp -p dromon-transfer --test matrix
      # Within GOLDEN_TOLERANCE per channel: other Mesa versions round a few pixels differently.
      - name: Goldens unchanged
        run: cargo goldens --check
      - name: Upload changed goldens
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: goldens-linux
          path: target/goldens
          if-no-files-found: ignore
          retention-days: 7
      - name: Smoke (headless, window under Xvfb, real connect)
        timeout-minutes: 20
        run: |
          cargo smoke
          cargo smoke --window
          cargo smoke --connect
      - name: Flows
        if: always()
        run: cargo flows target/flows
      - name: Upload flows
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flows-linux
          path: target/flows
          if-no-files-found: ignore
          retention-days: 14

  macos:
    runs-on: macos-15
    # The suite twice (plain, then against the native sshd).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Tests
        run: cargo test --workspace --locked
      # The native sshd's TOTP second factor for dromon_kbd (tests/docker/README.md): a bottle,
      # so seconds. Without it the TOTP tests would skip.
      - name: TOTP PAM module (Homebrew)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          brew install google-authenticator-libpam
          module="$(brew --prefix google-authenticator-libpam)/lib/security/pam_google_authenticator.so"
          ls -lL "$module"
          codesign -dv "$module" 2>&1 || true
      # No Docker on Apple-silicon runners (no nested virtualisation): the sshd fixture tests
      # again, against dromon-testkit's native backend (Apple's /usr/sbin/sshd as root through
      # the runner's passwordless sudo, users dromon_*; tests/docker/README.md). The TOTP tests
      # run there too: dromon_kbd's PAM service adds the module above to Apple's sshd policy.
      # Both commands run; the step fails if either does.
      - name: Tests (native sshd)
        env:
          DROMON_FIXTURE_BACKEND: native
          # Fail, don't skip, when the native sshd can't start.
          DROMON_REQUIRE_DOCKER: "1"
        run: |
          status=0
          cargo test --locked --no-fail-fast -p dromon-testkit -p dromon-ssh -p dromon-sftp -p dromon-transfer || status=1
          cargo test --locked --no-fail-fast -p dromon-app --test e2e --test transfers_e2e --test fileops_e2e --test poll_e2e --test quick_e2e --test windows_e2e --test wake_e2e || status=1
          exit "$status"
      # GitHub's macOS runners may not expose Metal to headless rendering; non-blocking until a
      # first green run proves it.
      - name: Smoke (headless)
        continue-on-error: true
        timeout-minutes: 5
        run: cargo smoke

  windows:
    runs-on: windows-2025
    # The suite twice (plain, then with the WSL2 Docker fixture) and the WSL setup in between.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The regular suite first; its Docker fixture tests skip here (the runner's own Docker runs
      # Windows containers only). The next steps give them a Linux Docker in WSL2.
      - name: Tests
        run: cargo test --workspace --locked
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: docker.io docker-buildx
      # WSL stops an idle distro, and dockerd with it.
      - name: Keep the distro running
        shell: pwsh
        run: Start-Process -WindowStyle Hidden wsl.exe -ArgumentList '-d','Ubuntu-24.04','-u','root','--','sleep','infinity'
      # Linux-side steps run through wsl-bash: scripts passed from pwsh to wsl keep CRLF endings.
      # docker.io's systemd unit owns dockerd, so the TCP listener comes from a drop-in.
      - name: dockerd on tcp 2375 too (systemd drop-in)
        shell: wsl-bash {0}
        run: |
          set -eux
          mkdir -p /etc/systemd/system/docker.service.d
          printf '[Service]\nExecStart=\nExecStart=/usr/bin/dockerd -H fd:// -H tcp://0.0.0.0:2375 --containerd=/run/containerd/containerd.sock\n' > /etc/systemd/system/docker.service.d/tcp.conf
          systemctl daemon-reload
          systemctl restart docker
      - name: Linux Docker answers from Windows
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddSeconds(60)
          while ($true) {
            try {
              $v = Invoke-RestMethod -TimeoutSec 5 http://127.0.0.1:2375/version
              if ($v.Os -eq 'linux') { "Docker $($v.Version) ($($v.Os)/$($v.Arch)) on 127.0.0.1:2375"; break }
            } catch {}
            if ((Get-Date) -gt $deadline) { throw 'no Linux Docker on http://127.0.0.1:2375 after 60 s' }
            Start-Sleep -Seconds 2
          }
      # The library crates' fixture tests, then dromon-app's end-to-end tests (the app's service
      # thread, and in e2e the headless UI without rendering, with dromon.exe as ssh's askpass
      # helper). Both commands run; the step fails if either does.
      - name: Tests (Docker sshd fixture in WSL2, Windows' OpenSSH)
        env:
          DOCKER_HOST: tcp://127.0.0.1:2375
          # Fail, don't skip, when the sshd fixture can't start.
          DROMON_REQUIRE_DOCKER: "1"
        # --no-fail-fast: one run shows every failing test binary, not just the first.
        run: |
          status=0
          cargo test --locked --no-fail-fast -p dromon-testkit -p dromon-ssh -p dromon-sftp -p dromon-transfer || status=1
          cargo test --locked --no-fail-fast -p dromon-app --test e2e --test transfers_e2e --test fileops_e2e --test poll_e2e --test quick_e2e --test windows_e2e --test wake_e2e || status=1
          exit "$status"
      - name: Docker state
        if: failure()
        shell: wsl-bash {0}
        run: |
          docker ps -a
          docker image ls
      # Headless rendering on Windows runners (WARP) is unproven, and so far it hangs at the
      # first render: non-blocking and bounded until it works.
      - name: Smoke (headless)
        continue-on-error: true
        timeout-minutes: 5
        run: cargo smoke
      # Windows' own OpenSSH server as the SFTP server (crates/dromon-transfer/tests/windows_sshd.rs):
      # /C:/ paths through RemotePath, a transfer round trip, renames, a copy and a delete. Windows
      # Server 2025 ships the OpenSSH.Server capability with its sshd service disabled (added here
      # if missing). The runner's user is an administrator, so a fresh key goes into
      # administrators_authorized_keys, Win32-OpenSSH's file for that group, which sshd only reads
      # while just Administrators and SYSTEM have access to it.
      - name: Tests (Windows OpenSSH server, /C:/ paths)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $cap = Get-WindowsCapability -Online -Name 'OpenSSH.Server*'
          "capability $($cap.Name): $($cap.State)"
          if ($cap.State -ne 'Installed') { Add-WindowsCapability -Online -Name 'OpenSSH.Server~~~~0.0.1.0' | Out-Null }
          Set-Service -Name sshd -StartupType Manual
          Start-Service sshd
          $openssh = Join-Path $env:WINDIR 'System32\OpenSSH'
          "sshd $((Get-Item (Join-Path $openssh 'sshd.exe')).VersionInfo.ProductVersion): $((Get-Service sshd).Status)"
          $dir = Join-Path $env:RUNNER_TEMP 'winsshd'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $key = Join-Path $dir 'id_ed25519'
          # Start-Process joins its arguments as they are, so '""' reaches ssh-keygen as an empty
          # passphrase (a direct call would depend on $PSNativeCommandArgumentPassing).
          $keygen = Start-Process -FilePath (Join-Path $openssh 'ssh-keygen.exe') -NoNewWindow -Wait -PassThru `
            -ArgumentList '-q', '-t', 'ed25519', '-N', '""', '-C', 'dromon-windows-sshd', '-f', $key
          if ($keygen.ExitCode -ne 0) { throw "ssh-keygen: exit $($keygen.ExitCode)" }
          $auth = Join-Path $env:ProgramData 'ssh\administrators_authorized_keys'
          Get-Content "$key.pub" | Set-Content -Encoding ascii -Path $auth
          icacls.exe $auth /inheritance:r /grant '*S-1-5-32-544:F' /grant '*S-1-5-18:F' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "icacls: exit $LASTEXITCODE" }
          function Show-SshdLog {
            Get-WinEvent -LogName 'OpenSSH/Operational' -MaxEvents 40 -ErrorAction SilentlyContinue |
              Sort-Object TimeCreated | Format-Table -AutoSize -Wrap TimeCreated, Message | Out-Host
          }
          # One login first, for a clear error when the server or the key doesn't work.
          & (Join-Path $openssh 'ssh.exe') -F NUL -o BatchMode=yes -o StrictHostKeyChecking=no `
            -o UserKnownHostsFile=NUL -o IdentitiesOnly=yes -i $key "$env:USERNAME@127.0.0.1" 'echo %USERNAME% on %COMPUTERNAME%'
          if ($LASTEXITCODE -ne 0) { Show-SshdLog; throw "no public-key login as $env:USERNAME on 127.0.0.1:22" }
          $env:DROMON_WINDOWS_SSHD = '1'
          $env:DROMON_WINDOWS_SSHD_KEY = $key
          $env:DROMON_WINDOWS_SSHD_USER = $env:USERNAME
          $env:DROMON_WINDOWS_SSHD_PORT = '22'
          cargo test --locked -p dromon-transfer --test windows_sshd -- --nocapture
          $status = $LASTEXITCODE
          if ($status -ne 0) { Show-SshdLog }
          exit $status

  # The Windows installer, unsigned, on every push: release.yml builds it only after the
  # release environment's approval, which once hid a WiX error (WIX0367) until a release
  # check. The same scripts as release.yml, then a silent install, check and uninstall.
  windows-package:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-windows-x64
          save-if: false
      - name: Build dromon.exe (release, version resource)
        shell: pwsh
        run: packaging/windows/build-exe.ps1 -Arch x64 -Out "$env:RUNNER_TEMP/windows"
      - name: WiX Toolset v5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version "5.*"
          if ($LASTEXITCODE -ne 0) { throw 'Could not install WiX.' }
          Join-Path $env:USERPROFILE '.dotnet\tools' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build the MSI
        shell: pwsh
        run: packaging/windows/build-msi.ps1 -Exe "$env:RUNNER_TEMP/windows/dromon.exe" -Arch x64 -Out "$env:RUNNER_TEMP/msi"
      - name: Install, check and uninstall it
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $msi = Get-ChildItem "$env:RUNNER_TEMP/msi/*.msi" | Select-Object -First 1
          packaging/windows/verify-msi.ps1 -Msi $msi.FullName -Version $version
