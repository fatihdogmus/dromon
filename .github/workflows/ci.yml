name: CI

# Every push to main and every pull request:
# - linux: clippy, the whole test suite with the Docker sshd fixture required (testcontainers),
#   goldens unchanged, the smoke script (headless, real window under Xvfb, real connect), and the
#   --script flows rendered as artifacts for review.
# - macos, windows: the test suite (the Docker fixture tests skip: no Linux containers there)
#   and the headless smoke.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Fail, don't skip, when the sshd fixture can't start.
      DROMON_REQUIRE_DOCKER: "1"
      # No GPU on the runner: Mesa's software Vulkan (lavapipe) renders the goldens and windows.
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev mesa-vulkan-drivers xvfb ffmpeg openssh-client
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (with the Docker sshd fixture)
        run: cargo test --workspace --locked
      - name: Goldens unchanged
        run: |
          bash scripts/goldens.sh
          if [ -n "$(git status --porcelain -- tests/goldens)" ]; then
            git status --short -- tests/goldens
            echo "::error::Goldens changed. Run scripts/goldens.sh, look at every changed image, and commit the ones you meant."
            exit 1
          fi
      - name: Upload changed goldens
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: goldens-linux
          path: tests/goldens
          retention-days: 7
      - name: Smoke (headless, window under Xvfb, real connect)
        run: |
          bash scripts/smoke-app.sh
          bash scripts/smoke-app.sh --window
          bash scripts/smoke-app.sh --connect
      - name: Flows
        if: always()
        run: bash scripts/flows.sh target/flows
      - name: Upload flows
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flows-linux
          path: target/flows
          if-no-files-found: ignore
          retention-days: 14

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Tests
        run: cargo test --workspace --locked
      # GitHub's macOS runners may not expose Metal to headless rendering; non-blocking until a
      # first green run proves it.
      - name: Smoke (headless)
        continue-on-error: true
        run: bash scripts/smoke-app.sh

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Tests
        run: cargo test --workspace --locked
      # Headless rendering on Windows runners (WARP) is unproven; non-blocking until it is.
      - name: Smoke (headless)
        continue-on-error: true
        run: bash scripts/smoke-app.sh
