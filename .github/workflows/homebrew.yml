name: Homebrew

# Updates the cask in the tap (fatihdogmus/homebrew-tap, Casks/dromon.rb) when a release is
# published by hand from its draft, so `brew install --cask fatihdogmus/tap/dromon` and
# `brew upgrade` get it. Only the latest non-prerelease release is written; the DMG must match
# the release's SHA256SUMS and its build attestation (.github/release/homebrew-update.sh).
#
# The `homebrew` environment holds HOMEBREW_TAP_DEPLOY_KEY, a deploy key with write access to
# the tap and nothing else. Without it the job only writes the cask to its summary.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to write the cask for (vX.Y.Z); must be the latest release"
        required: true

run-name: Homebrew cask for ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: read

concurrency:
  group: homebrew
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  cask:
    if: ${{ !github.event.release.prerelease }}
    runs-on: macos-15
    timeout-minutes: 20
    environment: homebrew
    permissions:
      contents: read
      attestations: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TAP: fatihdogmus/homebrew-tap
    steps:
      - name: Check out the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /.github/release/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: cask
        name: Check the release and write the cask
        run: bash .github/release/homebrew-update.sh "$RUNNER_TEMP/dromon.rb"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - id: key
        if: steps.cask.outputs.skip == 'false'
        name: Tap deploy key
        env:
          KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No HOMEBREW_TAP_DEPLOY_KEY in the homebrew environment; the tap is not updated."
            { echo '```ruby'; cat "$RUNNER_TEMP/dromon.rb"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check out the tap
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TAP }}
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Push the cask
        if: steps.key.outputs.present == 'true'
        env:
          VERSION: ${{ steps.cask.outputs.version }}
        run: |
          mkdir -p tap/Casks
          cp "$RUNNER_TEMP/dromon.rb" tap/Casks/dromon.rb
          cd tap
          if git diff --quiet --exit-code -- Casks/dromon.rb && git ls-files --error-unmatch Casks/dromon.rb > /dev/null 2>&1; then
            echo "The tap already has this cask."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/dromon.rb
          git commit -q -m "dromon $VERSION"
          git push -q origin HEAD
          echo "Pushed dromon $VERSION to $TAP." >> "$GITHUB_STEP_SUMMARY"
