name: Repro

# Reproduces a bug report headlessly and reports back on the issue.
#
# Trigger: a maintainer comments `/repro` on an issue, or adds the `repro` label. The job builds
# the default branch, runs `scripts/repro.sh <issue>` on the issue's ```json fixture```,
# ```json script``` and ```text args``` blocks (data only: nothing from the issue is ever run as
# shell), uploads the snapshot, strip, element tree and video, and comments with the summary.
#
# Agents triage the same way locally: `scripts/repro.sh <issue-number>`.

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: repro-${{ github.event.issue.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  repro:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'repro') ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/repro') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    env:
      ISSUE: ${{ github.event.issue.number }}
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      # The default branch's code, never the issue author's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev mesa-vulkan-drivers ffmpeg
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux
          save-if: false
      - name: Acknowledge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Reproducing on \`$(git rev-parse --short HEAD)\`: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Reproduce
        id: repro
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/repro.sh "$ISSUE" "$RUNNER_TEMP/repro" --repo "$GITHUB_REPOSITORY"
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: repro-${{ github.event.issue.number }}
          path: ${{ runner.temp }}/repro
          if-no-files-found: ignore
          retention-days: 30
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.repro.outcome }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            if [ "$OUTCOME" = success ]; then
              echo "### Repro ran"
            else
              echo "### Repro couldn't run (\`$OUTCOME\`)"
            fi
            echo
            echo "Outputs (snapshot, strip, element tree, video): artifact \`repro-$ISSUE\` on $run_url"
            echo
            if [ -s "$RUNNER_TEMP/repro/summary.md" ]; then
              cat "$RUNNER_TEMP/repro/summary.md"
            else
              echo "No summary was written; see the run's log."
            fi
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
